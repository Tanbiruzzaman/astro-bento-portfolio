<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Back ring gradient (fades into shadow behind the T) -->
    <linearGradient id="backRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a2b"/>
      <stop offset="55%" stop-color="#b80012"/>
      <stop offset="100%" stop-color="#3d0006"/>
    </linearGradient>
    <!-- Front ring gradient -->
    <linearGradient id="frontRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66000a"/>
      <stop offset="40%" stop-color="#e60017"/>
      <stop offset="100%" stop-color="#ff1a2b"/>
    </linearGradient>
  </defs>

  <!-- Black rounded square background (remove this <rect> if you want a transparent background) -->
  <rect width="100" height="100" rx="18" fill="#000000"/>

  <!-- Back half of the ring (rendered behind the T) -->
  <g transform="rotate(-22 50 54)">
    <path d="M 22 48 A 32 13 0 0 1 82 48" fill="none" stroke="url(#backRing)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Parallel lines forming the "T" -->
  <g fill="none" stroke="#e60017" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="miter">
    <!-- Left horizontal bars -->
    <line x1="24" y1="16" x2="48" y2="16"/>
    <line x1="28" y1="20.5" x2="46.5" y2="20.5"/>
    <line x1="21" y1="25" x2="45" y2="25"/>
    <line x1="25" y1="29.5" x2="43.5" y2="29.5"/>
    <line x1="29" y1="34" x2="42" y2="34"/>

    <!-- Right horizontal bars turning down into the stem -->
    <polyline points="78,16 53,16 32,76"/>
    <polyline points="74,20.5 55.5,20.5 34.5,82"/>
    <polyline points="81,25 58,25 38,85"/>
    <polyline points="76,29.5 60.5,29.5 42.5,81"/>
    <polyline points="71,34 63,34 46,79"/>
  </g>

  <!-- Front half of the ring (rendered in front of the T) + glossy highlight -->
  <g transform="rotate(-22 50 54)">
    <path d="M 22 48 A 32 13 0 0 0 82 48" fill="none" stroke="url(#frontRing)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 28 56.5 Q 52 62 74 55" fill="none" stroke="#ff99a2" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
