name: Build release
on:
  workflow_dispatch:
  push:
    branches: [deploy/node-hosting]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          TURSO_DATABASE_URL: file:./build-dummy.db
          SITE_URL: https://yourdomain.com
      - run: pnpm install --prod --frozen-lockfile
      - run: tar czf app.tar.gz dist node_modules package.json
      - run: gh release create "build-${{ github.run_number }}" app.tar.gz --title "Build ${{ github.run_number }}" --notes "Automated build"
        env:
          GH_TOKEN: ${{ github.token }}
